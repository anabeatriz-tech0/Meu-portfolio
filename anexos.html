<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anexos | Ana Beatriz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        .anexos-pagina { max-width: 1100px; margin: 55px auto; padding: 0 24px 60px; }
        .anexos-topo { text-align: center; margin-bottom: 35px; }
        .anexos-topo span { color: var(--vinho); font-size: 12px; font-weight: bold; letter-spacing: 3px; }
        .anexos-topo h1 { color: var(--vinho); font: 42px Georgia,serif; margin: 12px 0; }
        .anexos-topo p { color: #71676a; line-height: 1.7; }
        .galeria-estatica { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 22px; }
        .anexo-card { margin: 0; background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: 10px; overflow: hidden; }
        .anexo-card img { display:block; width:100%; height:250px; object-fit:cover; border-radius:8px; cursor: zoom-in; transition: transform .25s; }
        .anexo-card img:hover { transform: scale(1.025); }
        .anexo-card figcaption { color: var(--texto); padding: 12px 5px 5px; font-size: 14px; }
        .anexos-aviso { color:#71676a; text-align:center; font-size:13px; margin-top:25px; }
        @media(max-width:800px) { .galeria-estatica { grid-template-columns:repeat(2,minmax(0,1fr)); } }
        @media(max-width:520px) { .galeria-estatica { grid-template-columns:1fr; } .anexo-card img {height:230px;} .anexos-topo h1 {font-size:34px;} }
    </style>
</head>
<body>
    <header>
        <div class="logo">AB.</div>
        <nav>
            <a href="index.html">INÍCIO</a><a href="sobre.html">SOBRE MIM</a>
            <a href="objetivos.html">OBJETIVOS</a><a href="projetos.html">PROJETOS</a>
            <a href="areas.html">ÁREAS</a><a href="curriculo.html">CURRÍCULO</a>
            <a href="anexos.html" class="ativo">ANEXOS</a><a href="referencias.html">REFERÊNCIAS</a>
            <a href="contato.html">CONTATO</a><a href="#" onclick="sair(); return false;">SAIR</a>
        </nav>
    </header>
    <main class="anexos-pagina">
        <div class="anexos-topo">
            <span>REGISTROS VISUAIS</span>
            <h1>Meus Anexos</h1>
            <p>Registros visuais de atividades, trabalhos e experiências da minha trajetória escolar.</p>
        </div>
        <section class="galeria-estatica" aria-label="Galeria de anexos">
            <!-- PARA ADICIONAR FOTOS: coloque os arquivos na pasta img/anexos e copie um bloco figure abaixo.
                 Troque o caminho da imagem e o texto da legenda. Não existe formulário de envio no site. -->
            <!-- EXEMPLO:
            <figure class="anexo-card">
                <img src="img/anexos/nome-da-foto.jpg" alt="Descrição da foto" onclick="abrirImagem(this)">
                <figcaption>Descrição breve da imagem</figcaption>
            </figure>
            -->
        </section>
    </main>
    <div id="modalImagem" class="modal-imagem" role="dialog" aria-label="Imagem ampliada" aria-modal="true">
        <button class="fechar-modal" onclick="fecharImagem()" aria-label="Fechar imagem">&times;</button>
        <img id="imagemAmpliada" src="" alt="Imagem ampliada">
    </div>
    <script src="script.js"></script>

    <footer>
        <p class="tutores"><strong>Tutores:</strong> Cleiton Jericó • Regiane Leal</p>
        <p>© 2026 Ana Beatriz. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
