<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Referências | Ana Beatriz</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="auth.js"></script>
    <style>
        .referencias-pagina { max-width: 950px; margin: 55px auto; padding: 0 24px 60px; }
        .referencias-topo { text-align:center; margin-bottom:35px; }
        .referencias-topo span { color:var(--vinho); font-size:12px; font-weight:bold; letter-spacing:3px; }
        .referencias-topo h1 { color:var(--vinho); font:42px Georgia,serif; margin:12px 0; }
        .referencias-topo p { color:#71676a; line-height:1.7; }
        .referencias-lista { display:grid; gap:14px; }
        .referencia-item { display:flex; align-items:center; justify-content:space-between; gap:20px; background:#fff; border:1px solid var(--borda); border-radius:10px; padding:20px 22px; }
        .referencia-item h2 { font:20px Georgia,serif; color:var(--vinho); margin:0 0 8px; }
        .referencia-item a { color:#6f2638; overflow-wrap:anywhere; }
        .referencia-item .abrir-fonte { flex-shrink:0; display:inline-block; padding:10px 14px; border-radius:7px; background:var(--vinho); color:#fff; text-decoration:none; font-size:13px; }
        .referencia-vazia { text-align:center; color:#71676a; padding:25px; border:1px dashed #c9aeb3; border-radius:10px; }
        @media(max-width:600px) { .referencia-item {align-items:flex-start; flex-direction:column;} .referencias-topo h1 {font-size:34px;} }
    </style>
</head>
